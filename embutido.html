<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        em {
            color: orange
        }
        code {
            color: lime; 
            text-decoration: underline;
            font-family: sans-serif; 
        }
        dt >code
        {
            background-color: black;
            color:blueviolet
            font-weight: bolder;
        }

    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Em linha</h1>
        <p>Você pode aplicar um estilo <em >embutido</em>
        </em>
            para um elemento usando o atributo <code>style</code> == $0

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>cor do texto do elemento</dd>
            </div>
            <div>
                <dt><code>back-groundcolor</code></dt>
                <dd>cor do fundo do elemento</dd>
            </div>
        </dl>
    </main>
</body>
</html>
